openapi: 3.0.3
info:
  title: Hypernova Banking API
  version: 2.0.0
  license:
    name: Proprietary technical assessment implementation
    url: https://github.com/0xStyx507/hypernova-banking
  description: |
    Contrato HTTP de Hypernova Banking.

    Incluye identidad, sesiones, auditoría, cuentas USD y movimientos
    financieros respaldados por TigerBeetle. Los importes son unidades menores
    enteras serializadas como cadenas para evitar redondeos de punto flotante.
servers:
  - url: http://127.0.0.1:8080
    description: Desarrollo local
x-mcp-protocol-version: hypernova-mcp-http/2
# Public health and authentication operations opt in to security below; an
# empty root requirement makes the security posture explicit for every path.
security: []
tags:
  - name: Health
    description: Probes operativos de la API
  - name: Authentication
    description: Registro y gestión de sesiones
  - name: Ledger
    description: Cuentas y movimientos financieros respaldados por TigerBeetle
  - name: MCP
    description: Herramientas autenticadas con preparación y confirmación explícita
  - name: Assistant
    description: Chat autenticado con consultas MCP y preparación explícita de operaciones
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Comprueba que el proceso está activo
      tags: [Health]
      responses:
        '200':
          description: Proceso disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '404':
          description: Ruta no encontrada
  /readyz:
    get:
      operationId: getReadiness
      summary: Comprueba que PostgreSQL está disponible
      tags: [Health]
      responses:
        '200':
          description: Servicio listo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ruta no encontrada
  /api/v1/health:
    get:
      operationId: getVersionedHealth
      summary: Comprueba que el proceso está activo
      tags: [Health]
      responses:
        '200':
          description: Proceso disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '404':
          description: Ruta no encontrada
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Registra una identidad
      description: El email se normaliza a minúsculas y debe ser único.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Identidad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: JSON inválido, campos desconocidos o datos fuera de las reglas de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Crea una sesión autenticada
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas y sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
        '400':
          description: JSON inválido, campos desconocidos o cuerpo incompleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: MFA bloqueado temporalmente tras varios intentos fallidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: MFA configurado pero no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rota una sesión usando su refresh token
      description: El refresh token anterior queda inutilizable después de una rotación exitosa.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Sesión rotada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
        '400':
          description: JSON inválido, campos desconocidos o cuerpo incompleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token inválido, expirado, revocado o reutilizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: Revoca la sesión asociada al access token
      description: La operación es idempotente; requiere el esquema Bearer y no revela si el token corresponde a una sesión activa.
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión revocada o ya revocada
        '401':
          description: Falta un Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/profile:
    put:
      operationId: updateProfile
      summary: Actualiza el nombre del usuario autenticado
      description: Requiere una sesión con MFA verificado. El correo se mantiene de solo lectura hasta implementar un flujo de verificación de cambio de email.
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Nombre inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sesión inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: MFA no verificado en la sesión actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno de autenticación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/oauth/{provider}/start:
    get:
      operationId: startOAuth
      summary: Inicia autenticación con Google o GitHub
      description: Genera un state de un solo uso y redirige al proveedor configurado. No emite tokens en esta respuesta.
      tags: [Authentication]
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: return_to
          in: query
          required: false
          description: URI exacta previamente permitida en OAUTH_ALLOWED_REDIRECT_URIS.
          schema: { type: string }
      responses:
        '302':
          description: Redirección al proveedor OAuth
        '400':
          description: Proveedor no soportado
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: El proveedor no tiene configuración completa
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: Error interno al preparar el flujo
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/auth/oauth/{provider}/callback:
    get:
      operationId: completeOAuthCallback
      summary: Completa el callback del proveedor OAuth
      description: Valida y consume el state, verifica el perfil externo y devuelve un código efímero para el endpoint de exchange.
      tags: [Authentication]
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Código efímero listo para intercambio (JSON si no se solicitó return_to)
          content: { application/json: { schema: { $ref: '#/components/schemas/OAuthCallbackResponse' } } }
        '400':
          description: State inválido o expirado
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Autorización denegada o identidad no verificada
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: El email ya pertenece a otra identidad local
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '502':
          description: El proveedor no respondió correctamente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: El proveedor no está configurado o el ledger no está disponible
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: Error interno de autenticación
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/auth/oauth/{provider}/exchange:
    post:
      operationId: exchangeOAuthCode
      summary: Intercambia un código OAuth efímero por una sesión
      description: El código se consume una sola vez al crear la sesión. Si MFA está activo, se debe enviar el código TOTP.
      tags: [Authentication]
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
      responses:
        '200':
          description: Sesión creada
          content: { application/json: { schema: { $ref: '#/components/schemas/TokensResponse' } } }
        '400':
          description: Solicitud o proveedor inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Código expirado, inválido o MFA incorrecto/requerido
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: MFA bloqueado temporalmente tras varios intentos fallidos
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: Error interno de autenticación
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/auth/mfa:
    get:
      operationId: getMFAStatus
      summary: Consulta el estado del MFA del usuario autenticado
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estado del factor TOTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAStatus'
        '401':
          description: Sesión inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/auth/mfa/enroll:
    post:
      operationId: enrollMFA
      summary: Genera un enrolamiento TOTP de un solo uso
      description: Devuelve una URI otpauth estándar para crear un QR compatible con Google Authenticator y Microsoft Authenticator. El secreto solo se devuelve en esta respuesta.
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Enrolamiento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrollment'
        '401':
          description: Sesión inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: MFA no disponible
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMFA
      summary: Activa el MFA tras validar un código TOTP
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
      responses:
        '200':
          description: MFA activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAStatus'
        '401':
          description: Código inválido o sesión inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: Enrolamiento ausente o MFA ya activo
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '410':
          description: Enrolamiento expirado
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/auth/mcp-pin:
    get:
      operationId: getMCPPINStatus
      summary: Consulta si el usuario tiene un PIN MCP configurado
      description: Devuelve el estado y vencimiento del PIN; nunca expone el hash ni el PIN.
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estado del PIN MCP
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPPINStatus' } } }
        '401':
          description: Sesión inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    post:
      operationId: setMCPPIN
      summary: Crea o actualiza el PIN de confirmación MCP
      description: Requiere una sesión válida con MFA verificado. El PIN debe contener exactamente cuatro dígitos ASCII, se almacena como hash bcrypt y vence en tres minutos; al vencer se limpia de PostgreSQL.
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MCPPINRequest' } } }
      responses:
        '200':
          description: PIN configurado
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPPINStatus' } } }
        '400':
          description: El PIN no contiene exactamente cuatro dígitos
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Sesión inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '403':
          description: MFA no habilitado o no verificado en la sesión actual
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: Almacén de identidad no disponible
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/accounts:
    post:
      operationId: createAccount
      summary: Crea otra cuenta USD para el usuario autenticado
      description: Cada cuenta pertenece al usuario autenticado y puede seleccionarse como origen de una operación. La identidad recibe una cuenta inicial durante el registro.
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Cuenta provisionada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Solicitud inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: La clave de idempotencia fue reutilizada con otra intención
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    get:
      operationId: listAccounts
      summary: Lista las cuentas propias
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cuentas del usuario
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/accounts/{account_id}:
    get:
      operationId: getAccount
      summary: Obtiene una cuenta propia
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Cuenta
          content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Cuenta inexistente o ajena
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    delete:
      operationId: closeAccount
      summary: Cierra una cuenta propia con saldo cero
      description: Cierra lógicamente la cuenta y conserva sus referencias de auditoría. El saldo disponible y los movimientos pendientes deben ser cero.
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '204': { description: Cuenta cerrada }
        '401':
          description: Sesión inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Cuenta inexistente o ajena
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: La cuenta conserva saldo o movimientos pendientes
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    patch:
      operationId: renameAccount
      summary: Cambia el nombre visible de una cuenta propia
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 2, maxLength: 48 }
      responses:
        '200':
          description: Cuenta actualizada
          content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
        '400':
          description: Nombre inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Sesión inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Cuenta inexistente o ajena
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    put:
      operationId: renameAccountCompatibility
      deprecated: true
      summary: Alias temporal de compatibilidad para renombrar una cuenta
      description: Usa PATCH como método canónico. PUT se mantiene temporalmente para clientes antiguos.
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 2, maxLength: 48 }
      responses:
        '200':
          description: Cuenta actualizada
          content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
        '400':
          description: Nombre inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Sesión inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Cuenta inexistente o ajena
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/accounts/{account_id}/balance:
    get:
      operationId: getAccountBalance
      summary: Lee el saldo desde TigerBeetle
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Saldos en unidades menores
          content: { application/json: { schema: { $ref: '#/components/schemas/Balance' } } }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Cuenta inexistente o ajena
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/accounts/{account_id}/transactions:
    get:
      operationId: listAccountTransactions
      summary: Lista el historial reciente de una cuenta
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Cursor opaco devuelto por la página anterior; no debe interpretarse ni modificarse
          schema: { type: string }
      responses:
        '200':
          description: Transferencias más recientes primero
          content: { application/json: { schema: { $ref: '#/components/schemas/HistoryResponse' } } }
        '400':
          description: Límite o cursor inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '403':
          description: MFA no completado o cuenta ajena
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/accounts/{account_id}/transactions.csv:
    get:
      operationId: exportAccountTransactionsCsv
      summary: Exporta el historial reciente en CSV
      description: Exporta como máximo 100 movimientos después de comprobar la propiedad de la cuenta.
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Archivo CSV de movimientos
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Cuenta inexistente o ajena
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/accounts/{account_id}/deposits:
    post:
      operationId: createDeposit
      summary: Acredita fondos mediante la cuenta de compensación
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MovementRequest' } } }
      responses:
        '200':
          description: Operación registrada
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '400':
          description: Solicitud o clave de idempotencia inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: Clave reutilizada con otra solicitud
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '403':
          description: Canal de depósito demo deshabilitado
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Cuenta inexistente, inactiva o no autorizada
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: Ledger no disponible
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/accounts/{account_id}/withdrawals:
    post:
      operationId: createWithdrawal
      summary: Debita fondos hacia la cuenta de compensación
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MovementRequest' } } }
      responses:
        '200':
          description: Operación registrada
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '422':
          description: Fondos insuficientes
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Cuenta inexistente, inactiva o no autorizada; el código público es account_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '403':
          description: MFA no completado o ruta financiera no autorizada
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: Clave de idempotencia reutilizada con otra solicitud
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: Ledger no disponible
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/transfers:
    post:
      operationId: createTransfer
      summary: Transfiere fondos entre cuentas propias o externas USD
      description: transfer_type=own exige ownership en origen y destino; transfer_type=external exige una cuenta destino activa de otro usuario. Ambos flujos requieren Idempotency-Key.
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransferRequest' } } }
      responses:
        '200':
          description: Transferencia registrada
          content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } }
        '422':
          description: Fondos insuficientes o cuenta inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Cuenta origen o destino inexistente, inactiva o no autorizada
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: Una transferencia externa requiere un PIN de confirmación vigente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '400':
          description: Solicitud, moneda, tipo de transferencia o clave de idempotencia inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '403':
          description: MFA no completado o PIN de transferencia inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: PIN temporalmente bloqueado por demasiados intentos
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: Ledger o almacén de PIN no disponible
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/mcp/tools:
    get:
      operationId: listMCPTools
      summary: Lista herramientas disponibles para el cliente asistido
      description: Las herramientas de lectura son seguras para consulta; las mutaciones siempre requieren una acción preparada y confirmación explícita.
      tags: [MCP]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Herramientas disponibles
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPToolsResponse' } } }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/mcp/tools/call:
    post:
      operationId: callMCPTool
      summary: Ejecuta una consulta MCP o prepara una intención
      description: Las consultas no mutan el ledger; prepare_financial_action solo crea una acción pendiente.
      tags: [MCP]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MCPToolCallRequest' } } }
      responses:
        '200':
          description: Resultado de la herramienta
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPToolCallResponse' } } }
        '400':
          description: Herramienta o argumentos inválidos
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Herramienta inexistente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/mcp/actions:
    post:
      operationId: prepareMCPAction
      summary: Prepara una acción financiera sin ejecutarla
      description: Persiste una intención por cinco minutos. No cambia el saldo ni crea una transferencia en TigerBeetle.
      tags: [MCP]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MCPActionRequest' } } }
      responses:
        '201':
          description: Acción lista para confirmación
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPAction' } } }
        '400':
          description: Acción inválida
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/mcp/actions/pending:
    get:
      operationId: getPendingMCPAction
      summary: Recupera la acción MCP pendiente del usuario
      description: Devuelve la acción lista o en confirmación después de recargar la aplicación; si no existe devuelve action null.
      tags: [MCP]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Acción pendiente o null
          content:
            application/json:
              schema:
                type: object
                required: [action]
                properties:
                  action:
                    type: object
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/MCPAction'
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/mcp/actions/{action_id}:
    get:
      operationId: getMCPAction
      summary: Consulta el estado de una acción preparada
      tags: [MCP]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ActionID'
      responses:
        '200':
          description: Acción preparada
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPAction' } } }
        '404':
          description: Acción inexistente o ajena
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/mcp/actions/{action_id}/confirm:
    post:
      operationId: confirmMCPAction
      summary: Confirma y ejecuta una acción financiera
      description: 'Requiere el cuerpo exacto { pin: "1234" } con un PIN previamente configurado. El ID de la acción se reutiliza como clave idempotente.'
      tags: [MCP]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ActionID'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MCPConfirmationRequest' } } }
      responses:
        '200':
          description: Acción ejecutada
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPAction' } } }
        '400':
          description: Falta confirmación explícita
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: Acción no puede confirmarse en su estado actual
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: Token inválido o ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '403':
          description: PIN MCP inválido o MFA no verificado
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '410':
          description: Acción preparada expirada
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: PIN MCP bloqueado temporalmente
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: Almacén de PIN o ledger no disponible
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/mcp/actions/{action_id}/cancel:
    post:
      operationId: cancelMCPAction
      summary: Cancela una acción antes de su ejecución
      tags: [MCP]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ActionID'
      responses:
        '200':
          description: Acción cancelada
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPAction' } } }
        '409':
          description: Acción ya confirmada o en estado incompatible
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/chat/messages:
    post:
      operationId: sendChatMessage
      summary: Envía un mensaje al asistente bancario
      description: El proveedor local es el fallback; OpenRouter puede habilitarse de forma optativa. La salida se valida contra una allowlist y las operaciones financieras siempre requieren el flujo MCP de preparación y confirmación.
      tags: [Assistant]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChatRequest' } } }
      responses:
        '200':
          description: Respuesta del asistente
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatResponse' } } }
        '400':
          description: Mensaje inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '502':
          description: Asistente o MCP no disponible
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, github]
    AccountID:
      name: account_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ActionID:
      name: action_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: hypernova-api
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Mensaje público y no sensible del error
          example: invalid credentials
        code:
          type: string
          description: Código estable para clientes
          example: insufficient_funds
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Email sin nombre visible; se recorta y normaliza a minúsculas.
          example: person@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Entre 8 y 72 bytes antes de aplicar bcrypt. Se recomienda combinar letras, números y símbolos.
        full_name:
          type: string
          minLength: 2
          maxLength: 120
          description: Nombre visible, entre 2 y 120 caracteres Unicode.
          example: Person Example
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: person@example.com
        password:
          type: string
          format: password
        mfa_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Código TOTP de seis dígitos requerido cuando MFA está activo.
    OAuthExchangeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: Código efímero entregado por el callback OAuth; se consume una sola vez.
        mfa_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Código TOTP requerido cuando la cuenta tiene MFA activo.
    OAuthCallbackResponse:
      type: object
      required: [user, exchange_code, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/User'
        exchange_code:
          type: string
          description: Código efímero, no reutilizable, para crear la sesión.
        expires_at:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/Account'
    MFACodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    MFAStatus:
      type: object
      required: [enabled, enrolled]
      properties:
        enabled: { type: boolean }
        enrolled: { type: boolean }
    MFAEnrollment:
      type: object
      required: [secret, otpauth_uri, expires_at]
      properties:
        secret:
          type: string
          description: Secreto TOTP mostrado una sola vez para recuperación manual.
        otpauth_uri:
          type: string
          format: uri
          description: URI estándar para generar un QR compatible con autenticadores TOTP.
        expires_at: { type: string, format: date-time }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Token opaco emitido por login o refresh.
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [full_name]
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 120
          description: Nombre visible del usuario. El correo no se modifica por este endpoint.
    User:
      type: object
      required: [id, email, full_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        created_at:
          type: string
          format: date-time
    RegistrationResponse:
      type: object
      required: [user, account]
      properties:
        user:
          $ref: '#/components/schemas/User'
        account:
          $ref: '#/components/schemas/Account'
    TokensResponse:
      type: object
      required: [user, access_token, refresh_token, access_expires_at, refresh_expires_at]
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
          description: Token opaco; nunca es un JWT.
        refresh_token:
          type: string
          description: Token opaco de rotación; nunca es un JWT.
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
    CreateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          enum: [USD]
          default: USD
    MovementRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Unidades menores enteras, nunca un número de punto flotante
          example: '125000'
        currency:
          type: string
          enum: [USD]
          default: USD
    TransferRequest:
      allOf:
        - $ref: '#/components/schemas/MovementRequest'
        - type: object
          required: [source_account_id, destination_account_id]
          properties:
            source_account_id: { type: string, format: uuid }
            destination_account_id: { type: string, format: uuid }
            transfer_type:
              type: string
              enum: [own, external]
              default: own
              description: own exige ownership en ambas cuentas; external exige una cuenta activa de otro usuario.
            confirmation_pin:
              type: string
              pattern: '^[0-9]{4}$'
              writeOnly: true
              description: PIN requerido únicamente para transferencias externas.
    Account:
      type: object
      required: [id, display_name, currency, type, status, created_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, maxLength: 48 }
        currency: { type: string, enum: [USD] }
        type: { type: string, enum: [checking] }
        status: { type: string, enum: [provisioning, active, failed, closed] }
        created_at: { type: string, format: date-time }
    Balance:
      type: object
      required: [account_id, currency, balance, available_balance, credits_posted, debits_posted, credits_pending, debits_pending]
      properties:
        account_id: { type: string, format: uuid }
        currency: { type: string, enum: [USD] }
        balance: { type: string, pattern: '^[0-9]+$' }
        available_balance: { type: string, pattern: '^[0-9]+$' }
        credits_posted: { type: string, pattern: '^[0-9]+$' }
        debits_posted: { type: string, pattern: '^[0-9]+$' }
        credits_pending: { type: string, pattern: '^[0-9]+$' }
        debits_pending: { type: string, pattern: '^[0-9]+$' }
    Operation:
      type: object
      required: [id, type, status, transfer_id, amount, currency, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [deposit, withdrawal, transfer] }
        status: { type: string, enum: [succeeded] }
        transfer_id: { type: string }
        amount: { type: string, pattern: '^[1-9][0-9]*$' }
        currency: { type: string, enum: [USD] }
        created_at: { type: string, format: date-time }
    Transaction:
      type: object
      required: [transfer_id, type, direction, amount, currency, created_at]
      properties:
        transfer_id: { type: string }
        type: { type: string, enum: [deposit, withdrawal, transfer] }
        direction: { type: string, enum: [credit, debit] }
        amount: { type: string, pattern: '^[1-9][0-9]*$' }
        currency: { type: string, enum: [USD] }
        created_at: { type: string, format: date-time }
    HistoryResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        has_more: { type: boolean }
        next_cursor: { type: string, description: Cursor opaco para solicitar la siguiente página }
    MCPTool:
      type: object
      required: [name, read_only, description]
      properties:
        name: { type: string }
        read_only: { type: boolean }
        description: { type: string }
        input_schema: { type: object, additionalProperties: true }
    MCPToolsResponse:
      type: object
      required: [protocol, tools]
      properties:
        protocol: { type: string, example: hypernova-mcp-http/2 }
        tools:
          type: array
          items: { $ref: '#/components/schemas/MCPTool' }
    MCPActionRequest:
      type: object
      additionalProperties: false
      required: [action, amount]
      properties:
        action: { type: string, enum: [deposit, withdrawal, transfer] }
        account_id: { type: string, format: uuid }
        source_account_id: { type: string, format: uuid }
        destination_account_id: { type: string, format: uuid }
        transfer_type:
          type: string
          enum: [own, external]
          default: own
          description: Alcance explícito de la transferencia; el valor omitido se interpreta como own.
        amount: { type: string, pattern: '^[1-9][0-9]*$' }
        currency: { type: string, enum: [USD], default: USD }
        reason: { type: string, maxLength: 280 }
    MCPConfirmationRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin: { type: string, pattern: '^[0-9]{4}$', description: PIN MCP de exactamente cuatro dígitos ASCII }
    MCPPINRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin: { type: string, pattern: '^[0-9]{4}$', description: PIN MCP de exactamente cuatro dígitos ASCII }
    MCPPINStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean, description: Indica si existe un PIN vigente para el usuario }
        expires_at: { type: string, format: date-time, description: Hora de vencimiento del PIN vigente }
    MCPToolCallRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, example: get_accounts }
        arguments:
          type: object
          description: Para búsquedas se aceptan account_id, filtros type/direction/from/to/min_amount/max_amount y limit. Las fechas usan RFC3339 y los montos son unidades menores.
          properties:
            account_id: { type: string, format: uuid }
            limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
            cursor: { type: string, description: Cursor opaco devuelto por la página anterior }
            type: { type: string, enum: [deposit, withdrawal, transfer] }
            direction: { type: string, enum: [credit, debit] }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            min_amount: { type: string, pattern: '^[0-9]+$' }
            max_amount: { type: string, pattern: '^[0-9]+$' }
          additionalProperties: false
    MCPToolCallResponse:
      type: object
      required: [name, result]
      properties:
        name: { type: string }
        result: {}
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        account_id: { type: string, format: uuid, description: Cuenta activa seleccionada para contextualizar la consulta. }
        conversation:
          $ref: '#/components/schemas/ChatConversation'
    ChatResponse:
      type: object
      required: [message, requires_confirmation]
      properties:
        message: { type: string }
        requires_confirmation: { type: boolean }
        read_only_data: {}
        action: { $ref: '#/components/schemas/MCPAction' }
        conversation: { $ref: '#/components/schemas/ChatConversation' }
        account_options:
          type: array
          description: Cuentas activas disponibles para completar una operación pendiente.
          items: { $ref: '#/components/schemas/ChatAccountOption' }
    ChatAccountOption:
      type: object
      required: [id, display_name, currency]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        currency: { type: string, enum: [USD] }
    ChatConversation:
      type: object
      description: Intención incompleta que el cliente devuelve en el siguiente mensaje; no autoriza ni ejecuta fondos.
      properties:
        action: { type: string, enum: [deposit, withdrawal, transfer] }
        account_id: { type: string, format: uuid }
        source_account_id: { type: string, format: uuid }
        destination_account_id: { type: string, format: uuid }
        transfer_type: { type: string, enum: [own, external] }
