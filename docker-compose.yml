services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypernova}
      POSTGRES_USER: ${POSTGRES_USER:-hypernova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tigerbeetle:
    build:
      context: ./docker/tigerbeetle
      args:
        TIGERBEETLE_VERSION: ${TIGERBEETLE_VERSION:-0.15.4}
    environment:
      TIGERBEETLE_VERSION: ${TIGERBEETLE_VERSION:-0.15.4}
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetle-data:/data
    cap_add:
      - IPC_LOCK
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    environment:
      API_PORT: ${API_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://hypernova:change-me-local-only@postgres:5432/hypernova?sslmode=disable}
      TIGERBEETLE_ADDRESS: ${TIGERBEETLE_ADDRESS:-tigerbeetle:3000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${WEB_PORT:-4173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  tigerbeetle-data:

