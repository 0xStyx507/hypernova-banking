services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypernova}
      POSTGRES_USER: ${POSTGRES_USER:-hypernova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tigerbeetle:
    build:
      context: ./docker/tigerbeetle
      args:
        TIGERBEETLE_VERSION: ${TIGERBEETLE_VERSION:-0.15.4}
    environment:
      TIGERBEETLE_VERSION: ${TIGERBEETLE_VERSION:-0.15.4}
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetle-data:/data
    cap_add:
      - IPC_LOCK
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    environment:
      API_PORT: ${API_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://hypernova:change-me-local-only@postgres:5432/hypernova?sslmode=disable}
      TIGERBEETLE_ADDRESS: ${TIGERBEETLE_ADDRESS:-tigerbeetle:3000}
      # Local manual testing only. Production must set this to false and use
      # a trusted funding workflow instead of the demo clearing account.
      LEDGER_ALLOW_DEMO_DEPOSITS: ${LEDGER_ALLOW_DEMO_DEPOSITS:-true}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-168h}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://localhost:8080/api/v1/auth/oauth/google/callback}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URL: ${GITHUB_OAUTH_REDIRECT_URL:-http://localhost:8080/api/v1/auth/oauth/github/callback}
      OAUTH_STATE_TTL: ${OAUTH_STATE_TTL:-10m}
      OAUTH_EXCHANGE_TTL: ${OAUTH_EXCHANGE_TTL:-2m}
      OAUTH_ALLOWED_REDIRECT_URIS: ${OAUTH_ALLOWED_REDIRECT_URIS:-http://localhost:4173/,http://127.0.0.1:4173/,hypernova://oauth}
    ports:
      - "${API_PORT:-8080}:8080"
    # The official TigerBeetle client uses io_uring and locked buffers. Keep
    # the API unprivileged while granting only the capabilities required by
    # that native client in the local single-node environment.
    cap_add:
      - IPC_LOCK
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./datos-prueba-HNL.json:/seed/datos-prueba-HNL.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${WEB_PORT:-4173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  tigerbeetle-data:
